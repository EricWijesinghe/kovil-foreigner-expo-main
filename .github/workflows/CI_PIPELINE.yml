name: WONJOOMIN FOREIGNER - Frontend CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend - Lint, Typecheck, Test and Web Build
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      # typedRoutes 타입(.expo/types)은 dev 서버가 만들고 git에는 올리지 않는다.
      # 이 단계가 없으면 CI의 tsc는 잘못된 라우트를 통과시킨다 — 로컬보다 조용히 느슨해진다.
      - name: 🧭 Generate router types
        run: npx expo customize tsconfig.json

      - name: 🧾 Type check
        run: npm run typecheck

      - name: 🧪 Run Tests
        run: npm test -- --ci

      - name: 🏗️ Build Web (production export)
        run: npm run build:web

      - name: 📦 Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ github.run_number }}
          path: dist/
          retention-days: 7
